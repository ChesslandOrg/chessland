quarkus.application.name=player-core

quarkus.datasource.db-kind=mariadb
quarkus.flyway.migrate-at-start=true

quarkus.redis.hosts=${REDIS_URL:redis://:redis-local@localhost:6379}

quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8081/realms/chessland}

quarkus.otel.enabled=true
quarkus.otel.service.name=player-core
quarkus.otel.exporter.otlp.protocol=grpc

%local.quarkus.datasource.jdbc.url=${DB_URL:jdbc:mariadb://localhost:3306/player}
%local.quarkus.datasource.username=${DB_USERNAME:chessland}
%local.quarkus.datasource.password=${DB_PASSWORD:chessland-local}
%local.quarkus.redis.hosts=${REDIS_URL:redis://:redis-local@localhost:6379}
%local.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8081/realms/chessland}
%local.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

%dev.quarkus.datasource.jdbc.url=${DB_URL}
%dev.quarkus.datasource.username=${DB_USERNAME}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.redis.hosts=${REDIS_URL}
%dev.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}
%dev.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}

%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.redis.hosts=${REDIS_URL}
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}