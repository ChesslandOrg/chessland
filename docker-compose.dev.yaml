name: chessland-dev

services:

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chessland-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - chessland-net

  keycloak-config-cli:
    image: adorsys/keycloak-config-cli:latest-26
    restart: "no"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: "120s"

      IMPORT_FILES_LOCATIONS: /config/chessland-realm.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"

      WEB_CLIENT_REDIRECT_URI_1: ${WEB_CLIENT_REDIRECT_URI_1}
      WEB_CLIENT_REDIRECT_URI_2: ${WEB_CLIENT_REDIRECT_URI_2}
      WEB_CLIENT_WEB_ORIGIN: ${WEB_CLIENT_WEB_ORIGIN}

      PLAYER_CORE_CLIENT_SECRET: ${PLAYER_CORE_CLIENT_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    volumes:
      - ./chessland-realm.json:/config/chessland-realm.json:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - chessland-net

  chessland-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: chessland
      MARIADB_USER: chessland
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - chessland_db_data:/var/lib/mysql
      - ./chessland-db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chessland-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes"
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chessland-net

  player-core:
    image: ${IMAGE_PREFIX}/player-core:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: dev

      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mariadb://chessland-db:3306/player
      QUARKUS_DATASOURCE_USERNAME: chessland
      QUARKUS_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}

      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/chessland

      QUARKUS_REDIS_HOSTS: redis://:${REDIS_PASSWORD}@redis:6379

      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      QUARKUS_OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      chessland-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - chessland-net

  game:
    image: ${IMAGE_PREFIX}/game:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: dev

      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mariadb://chessland-db:3306/game
      QUARKUS_DATASOURCE_USERNAME: chessland
      QUARKUS_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}

      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/chessland

      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      QUARKUS_OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      chessland-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - chessland-net

  moderation:
    image: ${IMAGE_PREFIX}/moderation:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: dev

      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mariadb://chessland-db:3306/moderation
      QUARKUS_DATASOURCE_USERNAME: chessland
      QUARKUS_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}

      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/chessland

      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      QUARKUS_OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      chessland-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - chessland-net

  stats:
    image: ${IMAGE_PREFIX}/stats:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: dev

      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mariadb://chessland-db:3306/stats
      QUARKUS_DATASOURCE_USERNAME: chessland
      QUARKUS_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}

      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/chessland

      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      QUARKUS_OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      chessland-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - chessland-net

  puzzle:
    image: ${IMAGE_PREFIX}/puzzle:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE: dev

      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mariadb://chessland-db:3306/puzzle
      QUARKUS_DATASOURCE_USERNAME: chessland
      QUARKUS_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}

      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/chessland

      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      QUARKUS_OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      chessland-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - chessland-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - chessland-net

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    restart: unless-stopped
    networks:
      - chessland-net

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - chessland-net

  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - chessland-net

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - chessland-net

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - chessland-net

volumes:
  keycloak_db_data:
  chessland_db_data:
  redis_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  chessland-net:
    driver: bridge